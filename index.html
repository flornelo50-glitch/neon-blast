<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON BLAST ULTRA</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #03050c; color: #f8fafc; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 8px 8px 12px; background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #03050c 75%); }
  .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 410px; padding: 6px 12px; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 16px; }
  .crown-box { display: flex; align-items: center; gap: 4px; color: #fbbf24; font-weight: 800; font-size: 0.9rem; }
  .lvl-tag { font-size: 0.7rem; font-weight: 900; color: #38bdf8; }
  .score-main { font-size: 2.1rem; font-weight: 900; color: #fff; line-height: 1; text-shadow: 0 0 20px rgba(56, 189, 248, 0.85); }
  .xp-bar { width: 90px; height: 4px; background: rgba(255,255,255,0.12); border-radius: 4px; margin: 4px auto 0; overflow: hidden; }
  .xp-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #00f0ff, #ff007f); transition: width 0.3s; }
  .combo-badge { background: linear-gradient(135deg, #ec4899, #8b5cf6); padding: 4px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 900; opacity: 0; transition: opacity 0.2s; }
  .lang-btn { background: #1e293b; border: 1px solid #38bdf8; color: #38bdf8; border-radius: 8px; padding: 4px 8px; font-size: 0.75rem; font-weight: 900; }
  .board-wrap { position: relative; display: flex; justify-content: center; align-items: center; width: 100%; flex: 1; }
  canvas#game { border-radius: 18px; background: #070a16; border: 2px solid #38bdf8; box-shadow: 0 0 35px rgba(14, 165, 233, 0.3); }
  #hype { position: absolute; pointer-events: none; font-size: 2rem; font-weight: 900; color: #fde047; text-shadow: 0 4px 25px rgba(234, 179, 8, 1), 0 0 12px #f43f5e; opacity: 0; transform: scale(0.4); transition: all 0.35s ease-out; }
  .powers { display: flex; gap: 14px; justify-content: center; width: 100%; }
  .pwr-btn { display: flex; align-items: center; gap: 6px; background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); border: 1px solid #38bdf8; color: #e0f2fe; border-radius: 14px; padding: 8px 16px; font-size: 0.85rem; font-weight: 800; }
  .pwr-btn.active { border-color: #f43f5e; box-shadow: 0 0 15px #f43f5e; color: #fda4af; }
  .pwr-count { background: #38bdf8; color: #020617; border-radius: 50%; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 900; }
  #gameover { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.92); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 20; border-radius: 18px; }
  #gameover h2 { font-size: 2rem; color: #f43f5e; margin: 0 0 8px; }
  #gameover p { font-size: 1.05rem; color: #cbd5e1; margin: 0 0 22px; text-align: center; }
  .play-again { background: linear-gradient(135deg, #06b6d4, #ec4899); color: #fff; border: none; border-radius: 16px; padding: 14px 32px; font-size: 1.1rem; font-weight: 900; }
</style>
</head>
<body>
<div class="top-bar">
  <div><div class="crown-box">👑 <span id="best">0</span></div><div class="lvl-tag" id="lvl-txt">NÍVEL 1</div></div>
  <div style="text-align:center"><div class="score-main" id="score">0</div><div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div></div>
  <div style="display:flex;align-items:center;gap:6px"><div class="combo-badge" id="combo-badge">COMBO x2</div><button class="lang-btn" id="lang-btn" onclick="cycleLang()">PT</button></div>
</div>
<div class="board-wrap">
  <canvas id="game" width="320" height="440"></canvas>
  <div id="hype">PERFEITO!</div>
  <div id="gameover"><h2 id="go-title">SEM ESPAÇO!</h2><p id="final-stats">Pontos: 0</p><button class="play-again" id="go-btn" onclick="resetGame()">JOGAR NOVAMENTE</button></div>
</div>
<div class="powers">
  <button class="pwr-btn" id="btn-bomb" onclick="toggleBomb()">💣 <span id="lbl-bomb">BOMBA</span> <span class="pwr-count" id="cnt-bomb">2</span></button>
  <button class="pwr-btn" id="btn-swap" onclick="swapTray()">🔄 <span id="lbl-swap">TROCAR</span> <span class="pwr-count" id="cnt-swap">2</span></button>
</div>
<script>
const LANGS = {
  pt: { lvl: 'NÍVEL', bomb: 'BOMBA', swap: 'TROCAR', over: 'SEM ESPAÇO!', again: 'JOGAR NOVAMENTE', pts: 'Pontos', rec: 'Recorde', clear: 'TABULEIRO LIMPO!', words: ['', 'BOM!', 'EXCELENTE!', 'INCRÍVEL!', 'LENDÁRIO!', 'DIVINAL!'] },
  en: { lvl: 'LEVEL', bomb: 'BOMB', swap: 'SWAP', over: 'NO SPACE!', again: 'PLAY AGAIN', pts: 'Score', rec: 'Best', clear: 'BOARD CLEARED!', words: ['', 'GOOD!', 'GREAT!', 'INSANE!', 'LEGENDARY!', 'GODLIKE!'] },
  es: { lvl: 'NIVEL', bomb: 'BOMBA', swap: 'CAMBIAR', over: '¡SIN ESPACIO!', again: 'JUGAR DE NUEVO', pts: 'Puntos', rec: 'Récord', clear: '¡TABLERO LIMPIO!', words: ['', '¡BIEN!', '¡GENIAL!', '¡INCREÍBLE!', '¡LEGENDARIO!', '¡SUPREMO!'] },
  fr: { lvl: 'NIVEAU', bomb: 'BOMBE', swap: 'CHANGER', over: 'PLUS DE PLACE !', again: 'REJOUER', pts: 'Score', rec: 'Record', clear: 'PLATEAU VIDE !', words: ['', 'BIEN !', 'SUPER !', 'INCROYABLE !', 'LÉGENDAIRE !', 'DIVIN !'] }
};
const LANG_KEYS = ['pt', 'en', 'es', 'fr'];
let curLang = localStorage.getItem('nbLang') || (LANG_KEYS.includes(navigator.language.slice(0,2)) ? navigator.language.slice(0,2) : 'en');
const PALETTE = [null, { main: '#00f0ff', light: '#cffafe' }, { main: '#ff007f', light: '#fce7f3' }, { main: '#00ff66', light: '#dcfce7' }, { main: '#ffbe0b', light: '#fef9c3' }, { main: '#a855f7', light: '#f3e8ff' }, { main: '#ff5400', light: '#ffedd5' }];
const TIER1 = ['1', '11', '1|1', '11|11', '111', '1|1|1', '10|11', '01|11', '11|10', '11|01'];
const TIER2 = ['111|010', '010|111', '110|011', '011|110', '100|111', '001|111', '111|100', '111|001', '1111', '1|1|1|1'];
const TIER3 = ['111|111|111', '100|100|111', '001|001|111', '111|100|100', '111|001|001', '010|111|010', '11111', '1|1|1|1|1'];
const parseShape = str => str.split('|').map(r => r.split('').map(Number));
const BG_THEMES = ['radial-gradient(circle at 50% 20%, #1e1b4b 0%, #03050c 75%)', 'radial-gradient(circle at 50% 20%, #3b0764 0%, #03050c 75%)', 'radial-gradient(circle at 50% 20%, #4c0519 0%, #03050c 75%)', 'radial-gradient(circle at 50% 20%, #064e3b 0%, #03050c 75%)'];

const cvs = document.getElementById('game'), ctx = cvs.getContext('2d');
const GRID = 8;
let W = 320, H = 440, cell = 36, boardX = 16, boardY = 12, trayY = 320, trayCell = 20;
let grid = Array.from({ length: GRID }, () => Array(GRID).fill(0)), tray = [null, null, null];
let dragging = null, dragX = 0, dragY = 0, hoverPos = null;
let score = 0, displayScore = 0, best = Number(localStorage.getItem('neonBlastUltraBest') || 0);
let level = 1, combo = 0, bombs = 2, swaps = 2, bombMode = false, particles = [], shockwaves = [], floatTexts = [], shake = 0;
document.getElementById('best').innerText = best;

function applyLang() {
  const t = LANGS[curLang];
  document.getElementById('lang-btn').innerText = curLang.toUpperCase();
  document.getElementById('lvl-txt').innerText = `${t.lvl} ${level}`;
  document.getElementById('lbl-bomb').innerText = t.bomb; document.getElementById('lbl-swap').innerText = t.swap;
  document.getElementById('go-title').innerText = t.over; document.getElementById('go-btn').innerText = t.again;
  localStorage.setItem('nbLang', curLang);
}
function cycleLang() { curLang = LANG_KEYS[(LANG_KEYS.indexOf(curLang) + 1) % 4]; applyLang(); }
applyLang();

let actx = null;
function tone(f, type = 'sine', d = 0.12, v = 0.08) {
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.setValueAtTime(f, actx.currentTime); g.gain.setValueAtTime(v, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d); o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + d); } catch (e) {}
}
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
function resize() {
  const maxW = Math.min(window.innerWidth - 16, 400), maxH = Math.max(360, window.innerHeight - 135);
  cell = Math.max(30, Math.floor(Math.min(maxW / 8.5, maxH / 11.6)));
  W = cvs.width = Math.floor(cell * 8.5); H = cvs.height = Math.floor(cell * 11.6);
  boardX = (W - cell * 8) / 2; boardY = cell * 0.3; trayY = boardY + cell * 8.4; trayCell = cell * 0.54;
}
window.addEventListener('resize', resize);
function randPiece() {
  let pool = [...TIER1]; if (level >= 2) pool = pool.concat(TIER2); if (level >= 4) pool = pool.concat(TIER3);
  return { shape: parseShape(pool[Math.floor(Math.random() * pool.length)]), color: Math.floor(Math.random() * 6) + 1, scale: 0.2 };
}
function refillTray() { for (let i = 0; i < 3; i++) tray[i] = randPiece(); checkGameOver(); }
function canPlace(sh, gx, gy) {
  for (let r = 0; r < sh.length; r++) for (let c = 0; c < sh[r].length; c++) if (sh[r][c]) { const nr = gy + r, nc = gx + c; if (nr < 0 || nr >= GRID || nc < 0 || nc >= GRID || grid[nr][nc] !== 0) return false; }
  return true;
}
function checkGameOver() {
  const act = tray.filter(p => p !== null); if (!act.length) return;
  for (let p of act) for (let r = 0; r < GRID; r++) for (let c = 0; c < GRID; c++) if (canPlace(p.shape, c, r)) return;
  setTimeout(() => { const t = LANGS[curLang]; document.getElementById('final-stats').innerText = `${t.pts}: ${score}  |  ${t.lvl}: ${level}  |  ${t.rec}: ${best}`; document.getElementById('gameover').style.display = 'flex'; tone(110, 'sawtooth', 0.5, 0.15); buzz(120); }, 450);
}
function showHype(txt) { const el = document.getElementById('hype'); el.innerText = txt; el.style.opacity = 1; el.style.transform = 'scale(1.15)'; setTimeout(() => { el.style.opacity = 0; el.style.transform = 'scale(0.5)'; }, 900); }
function burst(gx, gy, ci) {
  const cx = boardX + (gx + 0.5) * cell, cy = boardY + (gy + 0.5) * cell, col = PALETTE[ci]?.main || '#38bdf8';
  for (let i = 0; i < 12; i++) { const a = Math.random() * 6.28, s = 1.8 + Math.random() * 5; particles.push({ x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, col, size: 3 + Math.random() * 4.5 }); }
}
function clearLines() {
  let rows = [], cols = [];
  for (let r = 0; r < GRID; r++) if (grid[r].every(v => v !== 0)) rows.push(r);
  for (let c = 0; c < GRID; c++) { let f = true; for (let r = 0; r < GRID; r++) if (!grid[r][c]) f = false; if (f) cols.push(c); }
  const tot = rows.length + cols.length;
  if (tot > 0) {
    combo++; const set = new Set();
    rows.forEach(r => { for (let c = 0; c < GRID; c++) set.add(`${r},${c}`); });
    cols.forEach(c => { for (let r = 0; r < GRID; r++) set.add(`${r},${c}`); });
    let lastCol = '#00f0ff';
    set.forEach(k => { const [r, c] = k.split(',').map(Number); lastCol = PALETTE[grid[r][c]]?.main || lastCol; burst(c, r, grid[r][c]); grid[r][c] = 0; });
    let pts = tot * 100 * tot * level + (combo > 1 ? combo * 60 * level : 0);
    const empty = grid.every(r => r.every(v => !v)); if (empty) pts += 1000 * level;
    score += pts; shake = Math.min(16, tot * 4 + combo * 2.5); buzz(35 + tot * 15);
    shockwaves.push({ x: W / 2, y: boardY + cell * 4, r: 15, maxR: W * 0.75, col: lastCol, life: 1 });
    const notes= '523,587,659,784,880,1046,1318'.split(',').map(Number); 
 tone(notes[Math.min(6, Math.max(0, tot + combo - 2))], 'triangle', 0.32, 0.15);
    const badge = document.getElementById('combo-badge'); if (combo > 1) { badge.innerText = `COMBO x${combo}`; badge.style.opacity = 1; } else badge.style.opacity = 0;
    if (empty) showHype(LANGS[curLang].clear); else if (tot >= 2 || combo >= 2) showHype(LANGS[curLang].words[Math.min(5, Math.max(tot, combo))]);
    floatTexts.push({ x: W / 2, y: boardY + cell * 4, txt: `+${pts}`, life: 1 });
  } else { combo = 0; document.getElementById('combo-badge').style.opacity = 0; }
  const nl = Math.floor(score / 1500) + 1;
  document.getElementById('xp-fill').style.width = (((score % 1500) / 1500) * 100) + '%';
  if (nl > level) { level = nl; document.getElementById('lvl-txt').innerText = `${LANGS[curLang].lvl} ${level}`; document.body.style.background = BG_THEMES[(level - 1) % 4]; showHype(`${LANGS[curLang].lvl} ${level}!`); tone(880, 'triangle', 0.4, 0.15); }
  if (score > best) { best = score; localStorage.setItem('neonBlastUltraBest', best); document.getElementById('best').innerText = best; }
}
function toggleBomb() { if (bombs <= 0) return; bombMode = !bombMode; document.getElementById('btn-bomb').classList.toggle('active', bombMode); tone(420, 'sine', 0.08); }
function swapTray() { if (swaps <= 0) return; swaps--; document.getElementById('cnt-swap').innerText = swaps; refillTray(); tone(620, 'triangle', 0.15); buzz(20); }
function resetGame() { grid = Array.from({ length: GRID }, () => Array(GRID).fill(0)); score = 0; displayScore = 0; level = 1; combo = 0; bombs = 2; swaps = 2; bombMode = false; document.body.style.background = BG_THEMES.at(0); document.getElementById('lvl-txt').innerText = `${LANGS[curLang].lvl} 1`; document.getElementById('xp-fill').style.width = '0%'; document.getElementById('cnt-bomb').innerText = 2; document.getElementById('cnt-swap').innerText = 2; document.getElementById('btn-bomb').classList.remove('active'); document.getElementById('gameover').style.display = 'none'; refillTray(); }
function drawGem(x, y, sz, ci, a = 1) { const p = PALETTE[ci]; if (!p) return; ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = p.main; ctx.fillRect(x + 1.5, y + 1.5, sz - 3, sz - 3); ctx.fillStyle = p.light; ctx.globalAlpha = a * 0.45; ctx.fillRect(x + 3.5, y + 3.5, sz - 7, (sz - 3) * 0.35); ctx.restore(); }

function loop() {
  ctx.clearRect(0, 0, W, H); ctx.save();
  if (shake > 0.2) { ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake *= 0.85; }
  for (let r = 0; r < GRID; r++) for (let c = 0; c < GRID; c++) {
    const x = boardX + c * cell, y = boardY + r * cell;
    ctx.fillStyle = (r + c) % 2 === 0 ? 'rgba(30, 41, 59, 0.55)' : 'rgba(15, 23, 42, 0.75)';
    ctx.fillRect(x + 1.5, y + 1.5, cell - 3, cell - 3);
    if (grid[r][c]) drawGem(x, y, cell, grid[r][c], 1);
  }
  if (dragging && hoverPos) {
    const sh = dragging.piece.shape;
    for (let r = 0; r < sh.length; r++) for (let c = 0; c < sh[r].length; c++) if (sh[r][c]) drawGem(boardX + (hoverPos.gx + c) * cell, boardY + (hoverPos.gy + r) * cell, cell, dragging.piece.color, 0.35);
  }
  for (let i = 0; i < 3; i++) {
    const p = tray[i]; if (!p || (dragging && dragging.idx === i)) continue;
    p.scale += (1 - p.scale) * 0.22;
    const slotX = boardX + (cell * 8 / 3) * (i + 0.5), pw = p.shape.at(0).length * trayCell * p.scale, ph = p.shape.length * trayCell * p.scale;
    const sx = slotX - pw / 2, sy = trayY + cell * 1.1 - ph / 2;
    for (let r = 0; r < p.shape.length; r++) for (let c = 0; c < p.shape[r].length; c++) if (p.shape[r][c]) drawGem(sx + c * trayCell * p.scale, sy + r * trayCell * p.scale, trayCell * p.scale, p.color);
  }
  if (dragging) {
    const sh = dragging.piece.shape, pw = sh.at(0).length * cell, ph = sh.length * cell, sx = dragX - pw / 2, sy = dragY - ph - cell * 0.95;
    for (let r = 0; r < sh.length; r++) for (let c = 0; c < sh[r].length; c++) if (sh[r][c]) drawGem(sx + c * cell, sy + r * cell, cell, dragging.piece.color);
  }
  shockwaves.forEach((sw, i) => { sw.r += (sw.maxR - sw.r) * 0.14; sw.life -= 0.045; if (sw.life <= 0) shockwaves.splice(i, 1); else { ctx.save(); ctx.strokeStyle = sw.col; ctx.globalAlpha = sw.life * 0.6; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, 6.28); ctx.stroke(); ctx.restore(); } });
  particles.forEach((pt, i) => { pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.14; pt.life -= 0.03; if (pt.life <= 0) particles.splice(i, 1); else { ctx.fillStyle = pt.col; ctx.globalAlpha = pt.life; ctx.fillRect(pt.x, pt.y, pt.size, pt.size); ctx.globalAlpha = 1; } });
  floatTexts.forEach((ft, i) => { ft.y -= 1.3; ft.life -= 0.025; if (ft.life <= 0) floatTexts.splice(i, 1); else { ctx.save(); ctx.globalAlpha = ft.life; ctx.font = '900 25px system-ui'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(ft.txt, ft.x, ft.y); ctx.restore(); } });
  ctx.restore();
  if (displayScore < score) { displayScore += Math.ceil((score - displayScore) * 0.22); document.getElementById('score').innerText = displayScore; }
  requestAnimationFrame(loop);
}

function getPos(e) { const rect = cvs.getBoundingClientRect(), t = e.touches ? e.touches.item(0) : e; return { x: (t.clientX - rect.left) * (W / rect.width), y: (t.clientY - rect.top) * (H / rect.height) }; }
cvs.addEventListener('touchstart', e => {
  e.preventDefault(); const pos = getPos(e);
  if (bombMode) {
    const gx = Math.floor((pos.x - boardX) / cell), gy = Math.floor((pos.y - boardY) / cell);
    if (gx >= 0 && gx < GRID && gy >= 0 && gy < GRID) {
      for (let r = gy - 1; r <= gy + 1; r++) for (let c = gx - 1; c <= gx + 1; c++) if (r >= 0 && r < GRID && c >= 0 && c < GRID && grid[r][c]) { burst(c, r, grid[r][c]); grid[r][c] = 0; }
      bombs--; document.getElementById('cnt-bomb').innerText = bombs; bombMode = false; document.getElementById('btn-bomb').classList.remove('active'); shake = 14; tone(120, 'sawtooth', 0.3, 0.15); buzz(60); checkGameOver();
    } return;
  }
  if (pos.y > boardY + cell * 8) {
    const idx = Math.floor((pos.x - boardX) / (cell * 8 / 3));
    if (idx >= 0 && idx < 3 && tray[idx]) { dragging = { idx, piece: tray[idx] }; dragX = pos.x; dragY = pos.y; tone(320, 'sine', 0.06, 0.05); buzz(10); }
  }
}, { passive: false });
cvs.addEventListener('touchmove', e => {
  e.preventDefault(); if (!dragging) return;
  const pos = getPos(e); dragX = pos.x; dragY = pos.y; const sh = dragging.piece.shape;
  const gx = Math.round((dragX - (sh.at(0).length * cell) / 2 - boardX) / cell), gy = Math.round((dragY - sh.length * cell - cell * 0.95 - boardY) / cell);
  hoverPos = canPlace(sh, gx, gy) ? { gx, gy } : null;
}, { passive: false });
cvs.addEventListener('touchend', e => {
  if (!dragging) return;
  if (hoverPos) {
    const sh = dragging.piece.shape; let b = 0;
    for (let r = 0; r < sh.length; r++) for (let c = 0; c < sh[r].length; c++) if (sh[r][c]) { grid[hoverPos.gy + r][hoverPos.gx + c] = dragging.piece.color; b++; }
    score += b * 10 * level; tray[dragging.idx] = null; tone(240, 'sine', 0.08, 0.07); buzz(15); clearLines();
    if (tray.every(p => !p)) refillTray(); else checkGameOver();
  }
  dragging = null; hoverPos = null;
});

resize(); refillTray(); loop();
</script>
</body>
</html>
